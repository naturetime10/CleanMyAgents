<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; cursor: default; }
  html, body { background: transparent; overflow: hidden; }
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
         padding: 4px 14px 18px; } /* room for the CSS shadow; window itself casts none */
  .island {
    background: rgba(28, 28, 30, .96);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 16px;
    padding: 14px 16px;
    color: #fff;
    box-shadow: 0 10px 34px rgba(0, 0, 0, .45);
    animation: pop .22s cubic-bezier(.3, .9, .4, 1.1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
  .head { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ffc84a; flex: none;
         animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .tool { font-family: ui-monospace, "SF Mono", monospace; font-size: 11.5px; color: #7fd4ff;
          background: rgba(127, 212, 255, .12); border-radius: 5px; padding: 1px 6px; }
  .count { margin-left: auto; font-size: 11px; font-weight: 400; color: #98929f;
           font-variant-numeric: tabular-nums; }
  .why { color: #c9c3d4; font-size: 12px; margin: 7px 0 8px;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .why b { color: #ffc84a; font-weight: 600; }
  .snippet { font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; color: #d8d3e3;
             background: rgba(255, 255, 255, .07); border-radius: 8px; padding: 7px 10px;
             margin-bottom: 11px; word-break: break-all;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .btns { display: flex; gap: 8px; }
  .col { flex: 1; }
  .btn { text-align: center; padding: 7px 0; border-radius: 8px; font-weight: 600;
         font-size: 13px; cursor: pointer; }
  .allow { background: #30d158; color: #032311; }       /* macOS system green */
  .deny { background: rgba(255, 255, 255, .12); }
  .btn:active { filter: brightness(1.2); }
  .sub { text-align: center; padding: 5px 0 0; font-size: 11px; color: #8b84a0; cursor: pointer; }
  .sub:active { color: #fff; }
</style>
</head>
<body>
  <div class="island" id="card">
    <div class="head">
      <span class="dot"></span>Tool call flagged
      <span class="tool" id="tool"></span>
      <span class="count" id="count"></span>
    </div>
    <div class="why">Matched <b id="hits"></b></div>
    <div class="snippet" id="snippet"></div>
    <div class="btns">
      <div class="col">
        <div class="btn deny" onclick="decide(false)">Deny once</div>
        <div class="sub" onclick="decide(false, true)">Always deny</div>
      </div>
      <div class="col">
        <div class="btn allow" onclick="decide(true)">Allow once</div>
        <div class="sub" onclick="decide(true, true)">Always allow</div>
      </div>
    </div>
  </div>
<script>
let id = null, left = 30, timer = null;

// Returns the height the window must be, so main can size it to fit — the
// content clamps itself (2-line matched + 2-line snippet), never scrolls.
function show(req) {
  id = req.id; left = 30;
  document.getElementById("tool").textContent = req.tool ?? "unknown";
  // a match names what it resembles, so the verdict is checkable
  document.getElementById("hits").textContent = (req.hits ?? []).join(", ")
    + (req.match ? ` — ${req.match.sim}% similar to a ${
        req.match.kind === "blocked" ? "previously blocked call" : "call you marked rubbish"}` : "");
  document.getElementById("snippet").textContent = (req.text ?? "").slice(0, 300);
  clearInterval(timer);
  document.getElementById("count").textContent = `auto-deny 30s`;
  timer = setInterval(() => {
    document.getElementById("count").textContent = `auto-deny ${--left}s`;
    if (left <= 0) decide(false);
  }, 1000);
  return document.body.scrollHeight;
}

function decide(allow, always = false) {
  clearInterval(timer);
  if (id) fetch("/decision", { method: "POST", body: JSON.stringify({ id, allow, always }) });
  id = null;
}
</script>
</body>
</html>
