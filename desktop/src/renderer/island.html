<!doctype html>
<meta charset="utf-8" />
<title>Approve</title>
<link rel="stylesheet" href="./island.css" />
<div class="island" id="root" hidden>
  <div class="head">
    <span class="dot" id="dot"></span>
    <span class="says" id="says"></span>
    <span class="tool" id="tool"></span>
    <span class="clock" id="clock"></span>
  </div>
  <code class="cmd" id="cmd"></code>
  <div class="row">
    <button class="primary deny" id="deny-once">Deny once</button>
    <button class="primary allow" id="allow-once">Allow once</button>
  </div>
  <div class="row minor">
    <button id="deny-always">Always deny</button>
    <span class="sep">·</span>
    <button id="allow-always">Always allow</button>
    <span class="why" id="why"></span>
  </div>
</div>
<script type="module" src="./island.ts"></script>
